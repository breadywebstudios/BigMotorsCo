<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Big Motors Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body class="page-car">

<div class="hud" id="hud" aria-hidden="true">
  <svg viewBox="0 0 120 120"><circle class="hud-track" cx="60" cy="60" r="50" pathLength="100"/><circle class="hud-fill" id="hud-fill" cx="60" cy="60" r="50" pathLength="100"/></svg>
  <div class="hud-read"><b id="hud-speed">000</b><span>km/h</span></div>
  <div class="hud-nitro"><i id="hud-nitro"></i></div>
</div>

<header class="nav solid" id="nav">
  <div class="wrap bar">
    <a class="mark" href="index.html" aria-label="Big Motors Co. home"><img src="img/logo.png" alt="Big Motors Co." width="112" height="65"></a>
    <ul>
      <li><a href="index.html#garage">Inventory</a></li>
      <li><a href="index.html#sell">Sell</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="index.html#about">About</a></li>
    </ul>
    <a class="btn red nitro" href="https://wa.me/971506686691" target="_blank" rel="noopener"><span>WhatsApp</span></a>
  </div>
</header>

<main class="detail">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html#garage">← The Garage</a><span id="crumb"></span></nav>

    <div class="detail-grid">
      <div class="gallery">
        <div class="stage" id="stage">
          <img id="main-img" alt="">
          <button class="g-nav prev" id="g-prev" type="button" aria-label="Previous photo">‹</button>
          <button class="g-nav next" id="g-next" type="button" aria-label="Next photo">›</button>
          <span class="g-count" id="g-count"></span>
          <button class="g-expand" id="g-expand" type="button" aria-label="View full screen">⤢</button>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <aside class="panel" id="panel"></aside>
    </div>

    <section class="about" id="car-about"></section>

    <nav class="carnav" id="carnav" aria-label="More cars"></nav>

    <section class="more">
      <div class="kicker">More from the garage</div>
      <div class="grid" id="more"></div>
    </section>
  </div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <img id="lb-img" alt="">
  <button class="g-nav prev" id="lb-prev" type="button" aria-label="Previous photo">‹</button>
  <button class="g-nav next" id="lb-next" type="button" aria-label="Next photo">›</button>
  <span class="g-count" id="lb-count"></span>
  <button class="lb-close" id="lb-close" type="button" aria-label="Close">✕</button>
</div>

<footer id="contact">
  <div class="wrap">
    <div class="top">
      <div class="tagline">Big Motors<br><span>Co.</span></div>
      <div class="channels">
        <div><div class="k">WhatsApp</div><a class="v" href="https://wa.me/971506686691" target="_blank" rel="noopener">+971 50 668 6691</a></div>
        <div><div class="k">Instagram</div><a class="v" href="https://www.instagram.com/bigmotorsco/" target="_blank" rel="noopener">@bigmotorsco</a></div>
        <div><div class="k">Viewing</div><span class="v">Dubai, by appointment</span></div>
      </div>
    </div>
    <div class="base">
      <span>© <span id="yr">2026</span> Big Motors Co.</span>
      <a href="https://breadywebstudio.vercel.app" target="_blank" rel="noopener">Powered by Bready Web Studios</a>
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
